name: Generar fichas ChicureoLocal

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "¿Dónde quieres generar las fichas?"
        required: true
        default: "prueba"
        type: choice
        options:
          - prueba
          - produccion

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mostrar modo seleccionado
        run: |
          echo "======================================"
          echo "ChicureoLocal"
          echo "Modo seleccionado: ${{ inputs.modo }}"
          echo "======================================"

      - name: Generar fichas
        env:
          CHICUREOLOCAL_MODO: ${{ inputs.modo }}
        run: python scripts/generar_fichas.py

      - name: Guardar fichas de prueba
        if: ${{ inputs.modo == 'prueba' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pruebas/

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Generar fichas de prueba"
            git push
          fi

      - name: Guardar fichas de producción
        if: ${{ inputs.modo == 'produccion' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Generar fichas de producción"
            git push
          fi
